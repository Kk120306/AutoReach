name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            # Clerk – dummy public key satisfies Next.js static analysis; real keys set in Vercel
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
            CLERK_SECRET_KEY: sk_test_placeholder
            NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
            NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: /dashboard
            NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL: /dashboard
            # Database – required by Prisma client generation
            DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
            # Stripe
            STRIPE_CLIENT_SECRET: sk_test_placeholder
            STRIPE_SUBSCRIPTION_PRICE_ID: price_placeholder
            # OpenAI
            OPENAI_API_KEY: sk-placeholder
            # App
            NEXT_PUBLIC_HOST_URL: http://localhost:3000
            # Instagram
            INSTAGRAM_CLIENT_ID: placeholder
            INSTAGRAM_CLIENT_SECRET: placeholder
            INSTAGRAM_BASE_URL: https://example.com
            INSTAGRAM_TOKEN_URL: https://example.com
            INSTAGRAM_EMBEDDED_OAUTH_URL: https://example.com

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm prisma generate

            - name: Type check
              run: pnpm type-check

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build
